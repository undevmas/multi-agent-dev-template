# Tools/docker-compose.yml
#
# Herramientas de análisis pre-productivo para SKILL-preprod-security-audit.md
#
# Puertos expuestos al host con offset +10000 sobre el default de cada
# herramienta, para minimizar choque con instalaciones locales existentes
# (ej. si ya tienes SonarQube corriendo en 9000 para otro proyecto).
# Todos son ajustables en .env sin tocar este archivo — ver .env.example.
#
# Servicios persistentes (se quedan arriba): sonarqube, sonarqube-db, trivy, zap
# Servicios on-demand (un solo uso, requieren --profile tools): semgrep,
# gitleaks, dependency-check, sonar-scanner, pa11y — no arrancan con `docker compose up`.

services:
  # ============================================================
  # SonarQube — SAST + calidad de código + cobertura importada
  # Requiere generar un token una sola vez desde la UI (ver README.md,
  # sección "Primer arranque de SonarQube") — no se puede automatizar
  # por completo porque Sonar exige cambiar el password admin en el
  # primer login antes de emitir tokens.
  # ============================================================
  sonarqube-db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - sonarqube_db_data:/var/lib/postgresql/data
    # Sin "ports:" — solo accesible dentro de la red de este compose.
    # Cero riesgo de choque de puerto porque nunca se expone al host.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d sonar -U sonar"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - preprod-tools

  sonarqube:
    image: sonarqube:community
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonar
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    ports:
      # host:contenedor — default real de Sonar es 9000, se expone en
      # ${SONARQUBE_HOST_PORT} para evitar choque con instalaciones locales
      - "${SONARQUBE_HOST_PORT:-19000}:9000"
    networks:
      - preprod-tools

  # ============================================================
  # Trivy — SCA + secrets + IaC, server mode (evita re-descargar
  # la DB de vulnerabilidades en cada scan)
  # Healthcheck confirmado contra la doc oficial: GET /healthz -> "ok"
  # ============================================================
  trivy:
    image: aquasec/trivy:latest
    restart: unless-stopped
    command: ["server", "--listen", "0.0.0.0:4954"]
    volumes:
      - trivy_cache:/root/.cache/trivy
    ports:
      # default real 4954
      - "${TRIVY_HOST_PORT:-14954}:4954"
    networks:
      - preprod-tools

  # ============================================================
  # OWASP ZAP — DAST, modo daemon con API sin key (uso local únicamente,
  # nunca exponer este puerto fuera de tu máquina/red de confianza).
  # Comando y healthcheck confirmados contra el Dockerfile-stable y
  # zap_common.py oficiales de zaproxy/zaproxy.
  # ============================================================
  zap:
    image: zaproxy/zap-stable
    restart: unless-stopped
    command: ["zap.sh", "-daemon", "-host", "0.0.0.0", "-port", "8080", "-config", "api.disablekey=true"]
    ports:
      # default real 8080
      - "${ZAP_HOST_PORT:-18080}:8080"
    networks:
      - preprod-tools
    # Si la app a escanear corre en tu host (ej. localhost:4200), ZAP
    # necesita alcanzarla — usa host.docker.internal:4200 como target,
    # no localhost:4200 (eso apuntaría al propio contenedor de ZAP).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # ============================================================
  # Herramientas on-demand — un solo uso, no quedan corriendo.
  # Invocar con: docker compose --profile tools run --rm <servicio> ...
  # ============================================================
  semgrep:
    image: semgrep/semgrep
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - ../Codigo:/src
      - ../Insumos:/report
    entrypoint: ["semgrep"]

  gitleaks:
    image: zricethezav/gitleaks
    profiles: ["tools"]
    working_dir: /src
    volumes:
      - ../:/src
      - ../Insumos:/report
    entrypoint: ["gitleaks"]

  # ============================================================
  # OWASP Dependency-Check — SCA, segundo motor como confirmación
  # cruzada de Trivy (un CVE reportado por cualquiera de los dos entra
  # al triage, ver SKILL-dependency-vulnerability-triage.md). Especialmente
  # útil para los stacks .NET/Java del template, donde su cobertura suele
  # ser más completa que la de Trivy.
  # Volumen de datos NVD como named volume -- sin esto, cada corrida
  # re-descarga toda la base de vulnerabilidades (ver DEPCHECK_NVD_API_KEY
  # en .env.example para acelerar solo la primera vez).
  # ============================================================
  dependency-check:
    image: owasp/dependency-check:latest
    profiles: ["tools"]
    volumes:
      - ../Codigo:/src
      - ../Insumos:/report
      - dependency_check_data:/usr/share/dependency-check/data

  pa11y:
    image: mcr.microsoft.com/playwright:v1.52.0-noble
    profiles: ["tools"]
    # Usa la imagen oficial de Playwright (con Chromium y dependencias de SO preinstaladas)
    # y ejecuta pa11y con npx porque `pa11y/pa11y` no existe en Docker Hub público.
    # pa11y (puppeteer) no trae navegador: usa el Chromium de la imagen. La ruta chromium-<rev>
    # depende de la etiqueta de la imagen; si se cambia la etiqueta, actualizarla
    # (`docker run --rm --entrypoint ls <imagen> /ms-playwright`).
    # pa11y.json pasa --no-sandbox: el contenedor corre como root y Chromium no arranca sin él.
    # Salida: 0 = sin hallazgos · 2 = hay hallazgos · otro = falló la herramienta (no evaluado).
    # Alternativa recomendada sin Docker: Playwright + @axe-core/playwright o npx pa11y desde la raíz.
    # La app objetivo debe estar corriendo en el host: usar http://host.docker.internal:<puerto>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      PUPPETEER_EXECUTABLE_PATH: /ms-playwright/chromium-1169/chrome-linux/chrome
    volumes:
      - ./pa11y.json:/pa11y.json:ro
    entrypoint: ["npx", "--yes", "pa11y@10.0.0", "--config", "/pa11y.json"]

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli
    profiles: ["tools"]
    working_dir: /usr/src
    volumes:
      - ../Codigo:/usr/src
    environment:
      SONAR_HOST_URL: "http://sonarqube:9000"
      # Sin ":?" -- Compose interpola TODO el archivo (incluidos servicios
      # con profile no activo) antes de filtrar por servicio, así que un
      # required-var aquí rompía "docker compose up sonarqube ..." aunque
      # sonar-scanner ni siquiera se estuviera levantando. La validación
      # real ocurre al invocar sonar-scanner sin token: falla solo, con
      # su propio error de autenticación contra SonarQube.
      SONAR_TOKEN: "${SONAR_TOKEN:-}"
    networks:
      - preprod-tools

networks:
  preprod-tools:
    driver: bridge

volumes:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
  sonarqube_db_data:
  trivy_cache:
  dependency_check_data:
